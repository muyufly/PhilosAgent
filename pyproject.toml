[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "philoagent"
version = "0.1.0"
description = "Philosophical initial state for MemEvolve memory evolution"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["python-dotenv==1.0.1"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
philoagent = "philoagent.cli:main"
philoagent-app = "philoagent_app.cli:main"

[tool.setuptools]
packages = ["philoagent", "philoagent_app"]

[tool.setuptools.package-data]
philoagent_app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "vendor/MemEvolve/Flash-Searcher-main"]
